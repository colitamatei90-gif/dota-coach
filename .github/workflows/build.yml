name: Build Windows exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller anthropic
      - run: python -m PyInstaller --onefile --name DotaCoach --add-data "index.html;." --hidden-import anthropic server.py
      - uses: actions/upload-artifact@v4
        with:
          name: DotaCoach
          path: dist/DotaCoach.exe
